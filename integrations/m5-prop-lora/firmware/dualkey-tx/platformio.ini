[platformio]
default_envs = chain-dualkey-c147

[env:chain-dualkey-c147]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../../shared/protocol

[env:chain-dualkey-c147-uart-smoke]
extends = env:chain-dualkey-c147
build_flags =
    ${env:chain-dualkey-c147.build_flags}
    -DDUALKEY_UART_SMOKE=1

[env:chain-dualkey-c147-dry-smoke]
extends = env:chain-dualkey-c147
build_flags =
    ${env:chain-dualkey-c147.build_flags}
    -DPROP_ALLOW_DRY_SMOKE_RUNTIME_KEY=1

[env:chain-dualkey-c147-dry-smoke-trace]
extends = env:chain-dualkey-c147-dry-smoke
build_flags =
    ${env:chain-dualkey-c147-dry-smoke.build_flags}
    -DDUALKEY_TX_TRACE=1

[env:chain-dualkey-c147-dry-smoke-auto]
extends = env:chain-dualkey-c147-dry-smoke
build_flags =
    ${env:chain-dualkey-c147-dry-smoke.build_flags}
    -DDUALKEY_AUTO_SMOKE=1
    -DDUALKEY_TX_TRACE=1

[env:chain-dualkey-c147-key-provision-dry-smoke]
extends = env:chain-dualkey-c147-dry-smoke
build_flags =
    ${env:chain-dualkey-c147-dry-smoke.build_flags}
    -DDUALKEY_KEY_PROVISION=1
    -I../../build/prop_key_provisioning_dry_smoke

[env:chain-dualkey-c147-key-provision-local]
extends = env:chain-dualkey-c147
build_flags =
    ${env:chain-dualkey-c147.build_flags}
    -DDUALKEY_KEY_PROVISION=1
    -I../../build/prop_key_provisioning_local

[env:chain-dualkey-c147-led-smoke]
extends = env:chain-dualkey-c147
build_flags =
    ${env:chain-dualkey-c147.build_flags}
    -DDUALKEY_LED_SMOKE=1
