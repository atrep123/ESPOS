[env:m5stack-c6l]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
; NOTE: do not pin official espressif arduino-esp32 tarballs here -- this platform is
; pioarduino, which ships its own (pioarduino-flavoured) framework. Pinning the official
; core left FRAMEWORK_DIR unresolved (pioarduino-build.py landed under -libs/<chip>/).
; Let the pioarduino platform install its matching framework.
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DC6L_MODEM_OLED_STATUS=1
    -I../../shared/protocol
lib_deps =
    m5stack/M5Unified
    jgromes/RadioLib
