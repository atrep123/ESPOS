; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.3.1
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
build_flags =
    -I../../shared/protocol
    -I../../shared/terminal
    -DDEBUG_HUD=0
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1   ; route Serial to the StampS3 native USB (no UART bridge on board)
    -DARDUINO_USB_MODE=1          ; USB-Serial-JTAG (matches the 303A:1001 CDC enumeration)

; Regenerate ui_theme_generated.h from tools/m5_theme.json before every build.
extra_scripts = pre:gen_theme_pre.py

monitor_filters = esp32_exception_decoder
monitor_speed = 115200

lib_deps =
    lovyan03/LovyanGFX @ 1.1.12
    forairaaaaa/SmoothUIToolKit @ 1.0.1
    adafruit/Adafruit NeoPixel @ ^1.12.3
    adafruit/Adafruit seesaw Library
    https://github.com/m5stack/M5Unit-ByteButton.git

[env:esp32-s3-devkitc-1-debug]
extends = env:esp32-s3-devkitc-1
build_flags =
    -I../../shared/protocol
    -I../../shared/terminal
    -DDEBUG_HUD=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    
    
[env:esp32-s3-devkitc-1-dry-smoke]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DPROP_ALLOW_DRY_SMOKE_RUNTIME_KEY=1

[env:esp32-s3-devkitc-1-dry-smoke-trace]
extends = env:esp32-s3-devkitc-1-dry-smoke
build_flags =
    -I../../shared/protocol
    -I../../shared/terminal
    -DDEBUG_HUD=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DPROP_ALLOW_DRY_SMOKE_RUNTIME_KEY=1
    -DDIN_RX_PROP_TRACE=1

[env:esp32-s3-devkitc-1-key-provision-dry-smoke]
extends = env:esp32-s3-devkitc-1-dry-smoke
build_flags =
    ${env:esp32-s3-devkitc-1-dry-smoke.build_flags}
    -DDIN_RX_KEY_PROVISION=1
    -I../../build/prop_key_provisioning_dry_smoke

[env:esp32-s3-devkitc-1-key-provision-local]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DDIN_RX_KEY_PROVISION=1
    -I../../build/prop_key_provisioning_local
