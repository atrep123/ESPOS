[platformio]
default_envs = sticks3-terminal-prop-link-g43-g44-600

[env:sticks3-terminal]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000
lib_ldf_mode = deep
build_flags =
    -DESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DTERMINAL_CHAIN_RX_PIN=10
    -DTERMINAL_CHAIN_TX_PIN=9
    -DTERMINAL_REQUIRE_CHAIN_UART=1
    -DTERMINAL_CHAIN_UART_SELECT_PAHUB=1
    -DTERMINAL_CHAIN_PAHUB_ADDRESS=0x70
    -DTERMINAL_CHAIN_PAHUB_CHANNEL=0
    -DTERMINAL_CHAIN_PAHUB_SDA_PIN=9
    -DTERMINAL_CHAIN_PAHUB_SCL_PIN=10
    -DTERMINAL_FADER_RAW_MIN=4095
    -DTERMINAL_FADER_RAW_MAX=0
    -DTERMINAL_EXTERNAL_OLED_ENABLED=1
    -DTERMINAL_EXTERNAL_OLED_DRIVER_SSD1309=1
    -DTERMINAL_EXTERNAL_OLED_LIVE_SINK_CONFIRMED=1
    -DTERMINAL_EXTERNAL_OLED_SELECT_PAHUB=1
    -DTERMINAL_EXTERNAL_OLED_SDA_PIN=9
    -DTERMINAL_EXTERNAL_OLED_SCL_PIN=10
    -DTERMINAL_EXTERNAL_OLED_I2C_ADDRESS=0x3C
    -DTERMINAL_EXTERNAL_OLED_PAHUB_ADDRESS=0x70
    -DTERMINAL_EXTERNAL_OLED_PAHUB_CHANNEL=3
    -DTERMINAL_FADER_PBHUB_ENABLED=1
    -DTERMINAL_FADER_PBHUB_RGB_ENABLED=1
    -DTERMINAL_PBHUB_I2C_ADDRESS=0x61
    -DTERMINAL_PBHUB_I2C_PORT=0
    -DTERMINAL_PBHUB_I2C_FREQ=400000
    -DTERMINAL_PBHUB_SDA_PIN=9
    -DTERMINAL_PBHUB_SCL_PIN=10
    -DTERMINAL_PBHUB_SELECT_PAHUB=1
    -DTERMINAL_PBHUB_PAHUB_ADDRESS=0x70
    -DTERMINAL_PBHUB_PAHUB_CHANNEL=5
    -DTERMINAL_PBHUB_RGB_MAX_BRIGHTNESS=24

extra_scripts = pre:apply_release_flags.py

lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    m5stack/M5Chain

[env:sticks3-terminal-live-debug]
extends = env:sticks3-terminal
build_flags =
    ${env:sticks3-terminal.build_flags}
    -DTERMINAL_LIVE_DEBUG=1

[env:sticks3-terminal-prop-link-g43-g44]
extends = env:sticks3-terminal
upload_speed = 460800
build_flags =
    ${env:sticks3-terminal.build_flags}
    -DTERMINAL_SETUP_TRANSPORT_USB=0
    -DTERMINAL_SETUP_TRANSPORT_PROP_LINK=1
    -DTERMINAL_PROP_LINK_RX_PIN=44
    -DTERMINAL_PROP_LINK_TX_PIN=43
    -DTERMINAL_PROP_LINK_BAUD=1200

[env:sticks3-terminal-prop-link-g43-g44-live-debug]
extends = env:sticks3-terminal-prop-link-g43-g44
build_flags =
    ${env:sticks3-terminal-prop-link-g43-g44.build_flags}
    -DTERMINAL_LIVE_DEBUG=1

[env:sticks3-terminal-prop-link-g43-g44-600]
extends = env:sticks3-terminal
upload_speed = 460800
build_flags =
    ${env:sticks3-terminal.build_flags}
    -DTERMINAL_SETUP_TRANSPORT_USB=0
    -DTERMINAL_SETUP_TRANSPORT_PROP_LINK=1
    -DTERMINAL_PROP_LINK_RX_PIN=44
    -DTERMINAL_PROP_LINK_TX_PIN=43
    -DTERMINAL_PROP_LINK_BAUD=600
    -DTERMINAL_UPLOAD_ACK_TIMEOUT_MS=8000

[env:sticks3-terminal-prop-link-g43-g44-600-live-debug]
extends = env:sticks3-terminal-prop-link-g43-g44-600
build_flags =
    ${env:sticks3-terminal-prop-link-g43-g44-600.build_flags}
    -DTERMINAL_LIVE_DEBUG=1

[env:sticks3-terminal-chain-uart-smoke]
extends = env:sticks3-terminal
build_unflags =
    -DTERMINAL_EXTERNAL_OLED_ENABLED=1
    -DTERMINAL_EXTERNAL_OLED_DRIVER_SSD1309=1
    -DTERMINAL_EXTERNAL_OLED_LIVE_SINK_CONFIRMED=1
build_flags =
    ${env:sticks3-terminal.build_flags}
    -DTERMINAL_CHAIN_UART_SMOKE=1
    -DTERMINAL_CHAIN_RX_PIN=10
    -DTERMINAL_CHAIN_TX_PIN=9
    -DTERMINAL_REQUIRE_CHAIN_UART=1
    -DTERMINAL_CHAIN_UART_SELECT_PAHUB=1
    -DTERMINAL_CHAIN_PAHUB_ADDRESS=0x70
    -DTERMINAL_CHAIN_PAHUB_CHANNEL=0
    -DTERMINAL_CHAIN_PAHUB_SDA_PIN=9
    -DTERMINAL_CHAIN_PAHUB_SCL_PIN=10

[env:sticks3-terminal-prop-link-smoke-g43-g44]
extends = env:sticks3-terminal
build_unflags =
    -DTERMINAL_EXTERNAL_OLED_ENABLED=1
    -DTERMINAL_EXTERNAL_OLED_DRIVER_SSD1309=1
    -DTERMINAL_EXTERNAL_OLED_LIVE_SINK_CONFIRMED=1
    -DTERMINAL_REQUIRE_CHAIN_UART=1
build_flags =
    ${env:sticks3-terminal.build_flags}
    -DTERMINAL_PROP_LINK_SMOKE=1
    -DTERMINAL_PROP_LINK_RX_PIN=44
    -DTERMINAL_PROP_LINK_TX_PIN=43
    -DTERMINAL_PROP_LINK_BAUD=115200

[env:sticks3-terminal-prop-link-smoke-g43-g44-9600]
extends = env:sticks3-terminal-prop-link-smoke-g43-g44
build_flags =
    ${env:sticks3-terminal.build_flags}
    -DTERMINAL_PROP_LINK_SMOKE=1
    -DTERMINAL_PROP_LINK_RX_PIN=44
    -DTERMINAL_PROP_LINK_TX_PIN=43
    -DTERMINAL_PROP_LINK_BAUD=9600

[env:sticks3-terminal-prop-link-smoke-g43-g44-1200]
extends = env:sticks3-terminal-prop-link-smoke-g43-g44
upload_speed = 460800
build_flags =
    ${env:sticks3-terminal.build_flags}
    -DTERMINAL_PROP_LINK_SMOKE=1
    -DTERMINAL_PROP_LINK_RX_PIN=44
    -DTERMINAL_PROP_LINK_TX_PIN=43
    -DTERMINAL_PROP_LINK_BAUD=1200

[env:sticks3-terminal-prop-link-rx-only-smoke-g43-g44-9600]
