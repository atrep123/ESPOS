build_flags =
    ${env:sticks3-terminal.build_flags}
    -DTERMINAL_EXTERNAL_OLED_I2C_SCAN_SMOKE=1
    -DTERMINAL_EXTERNAL_OLED_SDA_PIN=9
    -DTERMINAL_EXTERNAL_OLED_SCL_PIN=10
    -DTERMINAL_EXTERNAL_OLED_I2C_ADDRESS=0x70
    -DTERMINAL_I2C_SCAN_PAHUB_CHANNELS=1

[env:sticks3-terminal-oled-draw-smoke]
