name: CI

on:
  push:
    branches: [ main, master, codex/dodelavky-20260927 ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Readonly MCP/parser imports require this in the parent and xdist workers.
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-mcp.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2,<27"
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-mcp.txt
      - name: Verify public MCP and parser dependencies (readonly)
        run: |
          python -m pip check
          python -B - <<'PY'
          import sys
          from importlib.metadata import version

          assert sys.dont_write_bytecode, 'Readonly imports require disabled bytecode writes'
          from mcp.server.fastmcp import FastMCP
          from pydantic import BaseModel, TypeAdapter
          from tree_sitter import Language, Parser
          import tree_sitter_cpp

          assert version('tree-sitter') == '0.26.0'
          assert version('tree-sitter-cpp') == '0.23.4'
          parser = Parser(Language(tree_sitter_cpp.language()))
          tree = parser.parse(b'int public_dummy() { return 0; }')
          assert tree.root_node.type == 'translation_unit' and not tree.root_node.has_error
          print('PASS: public MCP/Pydantic imports, pinned C++ grammar and readonly bytecode contract')
          PY
      - name: Dependency security audit
        run: |
          # PlatformIO 6.1.x currently pins Starlette below the fixed 1.0.1
          # line for PYSEC-2026-161 / CVE-2026-48710. The reachability and
          # tracking rationale is documented in SECURITY.md; keep this ignore
          # explicit so it can be removed when PlatformIO publishes a
          # compatible Starlette range.
          python -m pip_audit -r requirements-dev.txt --strict --desc --ignore-vuln PYSEC-2026-161
      - name: MCP dependency security audit
        run: python -m pip_audit -r requirements-mcp.txt --strict --desc
      - name: Supply-chain guard
        run: python tools/check_supply_chain.py
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Mypy (codegen tools — strict)
        run: python -m mypy --ignore-missing-imports --no-error-summary tools/ui_codegen.py scripts/pio_generate_ui_design.py design_tokens.py shared_undo_redo.py event_manager.py constants.py
      - name: Mypy (designer — advisory)
        continue-on-error: true
        run: python -m mypy --ignore-missing-imports --no-error-summary ui_designer.py ui_models.py ui_template_manager.py || true
      - name: Validate design JSON (strict — fail on critical layout/readability)
        run: python tools/validate_design.py main_scene.json --strict-critical
      - name: Audit all design JSON (off-canvas / duplicate-id gate)
        run: python tools/audit_designs.py --root .
      - name: Codegen freshness check
        run: python scripts/check_codegen_freshness.py
      - name: Guardrail tests (designer refactors)
        run: |
          python -B -m pytest -q --tb=short \
            tests/test_input_handlers.py \
            tests/test_input_handlers_mouse.py \
            tests/test_focus_nav.py \
            tests/test_focus_nav_listmodel.py \
            tests/test_inspector_commit.py \
            tests/test_scene_ops.py
      - name: Run tests
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          # Worker count is BOUNDED (`-n 2 --maxprocesses 2`) instead of `-n auto`.
          # `-n auto` spawns one worker per logical CPU; on a 32-core host each of
          # the 32 workers independently loaded pygame + the full tree under an
          # unscoped `--cov=.` and ballooned to 100+GB committed, destabilizing the
          # machine. The cap, combined with coverage scoped via `[tool.coverage]`
          # in pyproject.toml (source = the real packages only, .venv/tests/.pio
          # omitted), keeps peak memory bounded and predictable on any host.
          # `--cov-fail-under` is set to an HONEST, structurally-defensible 80 (was
          # a manufactured "97" — see pyproject.toml `[tool.coverage.report]` and
          # docs/coverage_policy.md for why the vanity number was removed).
          # Make config and branch mode explicit for subprocesses tested from
          # foreign fixture directories; autodetection there has no pyproject.
          python -B -m pytest -q --tb=short --ignore=output -n 2 --maxprocesses 2 --cov --cov-config=pyproject.toml --cov-branch --cov-report=term-missing:skip-covered --cov-report=html:htmlcov --cov-fail-under=80 -m 'not native_windows'
      - name: Performance benchmarks
        if: matrix.python-version == '3.12'
        run: |
          python -B -m pytest tests/test_benchmarks.py --benchmark-only --benchmark-json=.benchmarks.json -q
      - name: Mutation testing (advisory)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          MUTATION_LOG_DIR: ${{ runner.temp }}/public-mutation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir "$MUTATION_LOG_DIR"
          printf 'Mutation run starting; report commands are best-effort diagnostics.\n' | tee "$MUTATION_LOG_DIR/status.log"
          # Stream the first 5 MiB per command, then keep draining to avoid SIGPIPE.
          # os.read forwards partial lines immediately; -u also covers mutmut children.
          bounded_output='
          import os
          import sys
          marker = b"\n[mutation log capped at 5 MiB; remaining output drained]\n"
          remaining = 5 * 1024 * 1024 - len(marker)
          truncated = False
          while True:
              chunk = os.read(0, 65536)
              if not chunk:
                  break
              kept = chunk[:remaining]
              sys.stdout.buffer.write(kept)
              remaining -= len(kept)
              if len(kept) < len(chunk) and not truncated:
                  sys.stdout.buffer.write(marker)
                  truncated = True
          '
          capture_log() {
            local log_name="$1"
            shift
            local -a statuses
            # Calls use || to suspend bash -e until every PIPESTATUS is captured.
            "$@" 2>&1 | python -u -c "$bounded_output" | tee "$MUTATION_LOG_DIR/$log_name"
            statuses=("${PIPESTATUS[@]}")
            # The runner's actual failure takes precedence over logging failures.
            local status
            for status in "${statuses[@]}"; do
              if (( status != 0 )); then return "$status"; fi
            done
            return 0
          }
          logging_status=0
          run_status=0
          capture_log run.log python -u -m mutmut run --no-progress || run_status=$?
          printf 'mutmut run pipeline exit: %s\n' "$run_status" | tee -a "$MUTATION_LOG_DIR/status.log" || logging_status=$?
          results_status=0
          capture_log results.log timeout --signal=TERM --kill-after=5s 60s python -u -m mutmut results || results_status=$?
          printf 'mutmut results pipeline exit: %s\n' "$results_status" | tee -a "$MUTATION_LOG_DIR/status.log" || logging_status=$?
          html_status=0
          capture_log html.log timeout --signal=TERM --kill-after=5s 60s python -u -m mutmut html || html_status=$?
          printf 'mutmut html pipeline exit: %s\n' "$html_status" | tee -a "$MUTATION_LOG_DIR/status.log" || logging_status=$?
          if (( run_status != 0 )); then exit "$run_status"; fi
          if (( results_status != 0 )); then exit "$results_status"; fi
          if (( html_status != 0 )); then exit "$html_status"; fi
          exit "$logging_status"
      - name: Upload mutation logs
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-mutation-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-mutation-${{ github.run_id }}-${{ github.run_attempt }}/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14
      - name: Upload benchmark results
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: .benchmarks.json
          retention-days: 30

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade "pip>=26.1.2,<27"
          python -m pip install -r requirements.txt
      - name: Cache PlatformIO
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Native tests
        run: pio test -e native
      - name: Build ESP32-S3 (nohw)
        run: pio run -e esp32-s3-devkitm-1-nohw
      - name: Build Arduino Nano ESP32 (nohw)
        run: pio run -e arduino_nano_esp32-nohw
